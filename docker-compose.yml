services:
  monitor:
    build: .
    # imagem publicada pelo workflow de release; a versão é escolhida no .env (IMAGE_TAG)
    image: ghcr.io/lhelheo/monitor-precos:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/precos.db
    ports:
      # só acessível pelo próprio servidor (use túnel SSH para abrir o painel)
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    # limite de memória para não pesar numa VPS de 4 GB
    mem_limit: 2g
    shm_size: 256m
